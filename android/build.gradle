group 'jp.pokepay.pokepay_sdk'
version '1.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // AGP 7+ では namespace の指定が必須 (AndroidManifest の package 属性は
    // AGP 8 でエラーになるため使えない)。古い AGP には namespace プロパティが
    // 存在しないので条件付きで設定する。
    if (project.android.hasProperty("namespace")) {
        namespace 'jp.pokepay.pokepay_sdk'
    }
    compileSdkVersion 32

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 32
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    android {
        compileOptions {
            sourceCompatibility 1.8
            targetCompatibility 1.8
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.11.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.11.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.11.1'
    implementation 'jp.pocket-change.pokepay.android-sdk:pokepaylib:2.0.27'
}
